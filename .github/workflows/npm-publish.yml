# EIDOLON Release & Publish Workflow
# Builds multi-arch binaries (amd64/arm64), attaches release artifacts, and safely publishes npm package

name: Release and Publish

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Go Tests
        run: cd server && go test -v ./...

  build-binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build Multi-Arch Server Binaries
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64/eidolon-server-linux-amd64"
            "linux/arm64/eidolon-server-linux-arm64"
            "darwin/amd64/eidolon-server-darwin-amd64"
            "darwin/arm64/eidolon-server-darwin-arm64"
            "windows/amd64/eidolon-server-windows-amd64.exe"
          )
          for p in "${platforms[@]}"; do
            os=$(echo $p | cut -d'/' -f1)
            arch=$(echo $p | cut -d'/' -f2)
            out=$(echo $p | cut -d'/' -f3)
            echo "Building for $os/$arch..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o dist/$out ./server/cmd/eidolon-server
            cd dist
            if [[ "$out" == *.exe ]]; then
              zip "${out%.exe}.zip" "$out"
            else
              tar -czvf "${out}.tar.gz" "$out"
            fi
            cd ..
          done
      - name: Upload Release Binaries
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Publish to npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm publish --access public || echo "npm publish encountered notice, continuing workflow."
          else
            echo "NPM_TOKEN secret is not set, skipping npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
